<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grid Dashboard | Responsive CSS Grid Page</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout">

  <!-- Sidebar (grid area: sidebar) -->
  <aside class="sidebar">
    <div class="brand"><i class="fa-solid fa-cubes"></i> GridBoard</div>
    <nav>
      <a href="#" class="active"><i class="fa-solid fa-table-cells"></i> Dashboard</a>
      <a href="#"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      <a href="#"><i class="fa-solid fa-folder"></i> Projects</a>
      <a href="#"><i class="fa-solid fa-users"></i> Team</a>
      <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
  </aside>

  <!-- Header (grid area: header) -->
  <header class="topbar">
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
    <h1>Responsive Grid Dashboard</h1>
    <div class="user-chip"><i class="fa-solid fa-circle-user"></i> Mohamed</div>
  </header>

  <!-- Main (grid area: main) — a nested CSS grid of stat/content cards -->
  <main class="content">
    <section class="stats-grid" id="statsGrid"></section>

    <section class="panels-grid">
      <article class="panel panel-wide">
        <h2>Weekly Overview</h2>
        <div class="bars" id="barsChart"></div>
      </article>
      <article class="panel">
        <h2>Recent Projects</h2>
        <ul class="project-list" id="projectList"></ul>
      </article>
    </section>

    <section class="gallery-grid" id="galleryGrid"></section>
  </main>

  <!-- Footer (grid area: footer) -->
  <footer class="footer">
    &copy; <span id="year"></span> GridBoard — Built entirely with CSS Grid, no frameworks.
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
